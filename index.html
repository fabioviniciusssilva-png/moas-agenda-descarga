<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d3937">
<title>Agenda de Recebimento MOAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quadro de docas — barra da semana, faixa de totais, 6 colunas (seg–sáb) com cartões por horário; formulário em painel lateral */
:root{
  --bg:#edf1ee; --panel:#ffffff; --panel-2:#f5f8f6; --ink:#1e2928; --muted:#607870; --line:#c6d1c7;
  --accent:#c4853a; --accent-ink:#ffffff; --brand:#2d3937; --brand-soft:#e1e8e2; --sage:#8fa898; --sage-bg:#b8c4ba;
  --ok:#3d6e50; --ok-bg:#dfeae2; --warn:#9a6224; --warn-bg:#f5e8d6; --bad:#b05050; --bad-bg:#f5e0e0; --info:#4f665e; --info-bg:#e4ebe6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#182120; --panel:#202b29; --panel-2:#26322f; --ink:#e6ece7; --muted:#9fb2a6; --line:#34423f;
  --accent:#d59a52; --accent-ink:#1a1206; --brand:#b8c4ba; --brand-soft:#2a3834; --sage:#8fa898; --sage-bg:#607870;
  --ok:#8fc4a0; --ok-bg:#1f3328; --warn:#e0ac6b; --warn-bg:#3a2d1c; --bad:#e09090; --bad-bg:#3a2222; --info:#a9bfb2; --info-bg:#25332e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#182120; --panel:#202b29; --panel-2:#26322f; --ink:#e6ece7; --muted:#9fb2a6; --line:#34423f;
  --accent:#d59a52; --accent-ink:#1a1206; --brand:#b8c4ba; --brand-soft:#2a3834; --sage:#8fa898; --sage-bg:#607870;
  --ok:#8fc4a0; --ok-bg:#1f3328; --warn:#e0ac6b; --warn-bg:#3a2d1c; --bad:#e09090; --bad-bg:#3a2222; --info:#a9bfb2; --info-bg:#25332e;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
.head{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:inset 0 4px 0 var(--brand);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--sage)}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;min-width:0}
.logo{display:flex;align-items:center;background:#b8c4b9;border-radius:6px;padding:4px 6px;flex:none}
.logo img{display:block;width:164px;height:auto;max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--panel);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Barra da semana */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.weeknav{display:flex;align-items:center;gap:6px}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;display:grid;place-items:center;font-size:16px}
.weeklabel{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:.02em;min-width:0}
.weeklabel small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--panel-2);padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--panel);font-weight:600}
.filter{display:flex;align-items:center;gap:6px}
.filter input{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:7px 10px;width:200px;max-width:100%}

/* Totais */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.tot .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tot .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tot .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}

/* Aviso */
.notice{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px}
.notice b{font-weight:600}
.notice .btn{padding:5px 10px;font-size:12px}

/* Quadro */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
.day{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.dayname{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.daydate{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.daysum{display:flex;gap:10px;padding:6px 12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.daysum b{color:var(--ink);font-weight:500}
.slots{display:flex;flex-direction:column;gap:8px;padding:10px}
.empty{color:var(--muted);font-size:12.5px;padding:10px 4px;text-align:center}
.add-day{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:7px;color:var(--muted);font-size:12.5px}
.add-day:hover{border-color:var(--brand);color:var(--brand)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;position:relative}
.card:hover{border-color:var(--brand)}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.time{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.dock{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.05em;background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:3px}
.company{font-weight:600;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.product{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.qty{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.qty span b{font-weight:500}
.meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-left:auto}
.st-Agendado{background:var(--info-bg);color:var(--info)}
.st-Chegou{background:var(--warn-bg);color:var(--warn)}
.st-Descarregando{background:var(--brand-soft);color:var(--brand)}
.st-Concluído{background:var(--ok-bg);color:var(--ok)}
.st-No-show,.st-Cancelado{background:var(--bad-bg);color:var(--bad)}
.card.done{opacity:.72}
.tag{font-size:10px;font-family:var(--f-mono);border:1px solid var(--line);color:var(--muted);border-radius:3px;padding:0 4px}
.clash{font-size:11px;color:var(--bad);font-weight:600}

/* Alertas de chegada */
.alertbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--panel)}
.alertbar.soon{border-color:var(--accent);background:var(--warn-bg)}
.alertbar.late{border-color:var(--bad);background:var(--bad-bg)}
.alertbar .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.alertbar.soon .dot{background:var(--accent)}
.alertbar.late .dot{background:var(--bad)}
.alertbar .msg{font-weight:600;min-width:0;flex:1 1 240px}
.alertbar .msg small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.alertbar label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.alertbar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px}
.alertbar .btn{padding:5px 10px;font-size:12.5px}
.eta{font-family:var(--f-mono);font-size:11.5px;font-weight:500;border-radius:4px;padding:2px 6px;align-self:flex-start}
.eta.soon{background:var(--warn-bg);color:var(--warn)}
.eta.late{background:var(--bad-bg);color:var(--bad)}
.card.urg-soon{border:2px solid var(--accent)}
.card.urg-late{border:2px solid var(--bad)}
tr.urg-soon td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
tr.urg-late td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .card.urg-soon,.alertbar.soon .dot{animation:blinkSoon 1.4s ease-in-out infinite}
  .card.urg-late,.alertbar.late .dot{animation:blinkLate .9s ease-in-out infinite}
  .eta.soon,.eta.late{animation:fade 1.4s ease-in-out infinite}
  @keyframes blinkSoon{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--accent)}}
  @keyframes blinkLate{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px var(--bad)}}
  @keyframes fade{50%{opacity:.45}}
}

/* Tabela */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel-2);position:sticky;top:0}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.dayrow td{background:var(--brand-soft);font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--brand)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--panel-2)}

/* Relatório */
.report{display:flex;flex-direction:column;gap:14px}
.rbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rbar h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
.rbar .sub{font-size:12.5px;color:var(--muted)}
.rbar .acts{display:flex;flex-wrap:wrap;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.rcard h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0;padding:12px 14px 8px}
.rcard .tw{overflow-x:auto}
.rcard table{min-width:0}
.rcard tfoot td{font-weight:600;border-bottom:0;background:var(--panel-2)}
.bar{height:6px;border-radius:3px;background:var(--brand-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand)}
.occ{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.occ li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.occ li .pill{margin-left:0;flex:none}
.occ .none{color:var(--muted)}
.full{grid-column:1/-1}

/* Painel do formulário */
.scrim{position:fixed;inset:0;background:rgba(20,30,28,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700}
.drawer form{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
legend{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:500}
.f label i{font-style:normal;color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:8px 10px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.drawer footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.drawer footer .grow{flex:1}
.formmsg{font-size:12.5px;color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb"];
  const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const COL = "agendamentos";

  const SB_URL="https://mtbvkhubrwcjsljwjcmq.supabase.co", SB_KEY="sb_publishable_6lbrzB3Z_chtr1uW_vxu1A_Gsn5jVss", TABLE="agenda_descarga";
  let sb = null, loadedFrom = null, canXlsx = true, canWrite = true, items = [], weekStart = mondayOf(new Date()), view = "board", q = "", editingId = null, offline = false;

  function pad(n){return String(n).padStart(2,"0")}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
  function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
  function fmtN(n){return (Number(n)||0).toLocaleString("pt-BR")}
  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

  // Exemplo usado só quando a página não consegue conectar ao armazenamento compartilhado
  function sampleWeek(){
    const m=mondayOf(new Date()),d=i=>iso(addDays(m,i));
    return [
      {id:"s1",data:d(0),hora:"07:30",doca:"D1",empresa:"Fornecedor Exemplo A",transportadora:"Transp. Exemplo",placa:"ABC1D23",veiculo:"Container 40'",produto:"Revestimento cerâmico 60x60",qtd:1840,un:"CX",pallets:24,palTipo:"PBR",nf:"NF 10234",status:"Concluído",exemplo:true},
      {id:"s2",data:d(0),hora:"10:00",doca:"D2",empresa:"Fornecedor Exemplo B",transportadora:"",placa:"",veiculo:"Truck",produto:"Argamassa AC-II 20kg",qtd:600,un:"UN",pallets:10,palTipo:"Descartável",nf:"",status:"Concluído",exemplo:true},
      {id:"s3",data:d(2),hora:"08:00",doca:"D1",empresa:"Fornecedor Exemplo C",transportadora:"Transp. Exemplo",placa:"",veiculo:"Carreta",produto:"Porcelanato 90x90",qtd:22,un:"UN",pallets:22,palTipo:"PBR",nf:"",status:"Descarregando",exemplo:true},
      {id:"s4",data:d(2),hora:"14:00",doca:"D3",empresa:"Fornecedor Exemplo A",transportadora:"",placa:"",veiculo:"Container 20'",produto:"Rejunte flexível 1kg",qtd:3200,un:"UN",pallets:0,palTipo:"Batida (sem pallet)",nf:"",status:"Agendado",obs:"Carga batida, precisa paletizar",exemplo:true},
      {id:"s5",data:d(3),hora:"09:00",doca:"D2",empresa:"Fornecedor Exemplo D",transportadora:"",placa:"",veiculo:"Carreta",produto:"Metais sanitários",qtd:450,un:"CX",pallets:14,palTipo:"Fumigado",nf:"",status:"Agendado",exemplo:true},

    ];
  }

  function palletsOf(it){return Number(it.pallets)||0}

  function filtered(){
    const start=iso(weekStart),end=iso(addDays(weekStart,6));
    const qq=q.trim().toLowerCase();
    return items.filter(it=>it.data>=start&&it.data<end).filter(it=>!qq||[it.empresa,it.produto,it.nf,it.transportadora,it.placa,it.doca].join(" ").toLowerCase().includes(qq))
      .sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  }

  function clashes(list){
    const seen={},bad=new Set();
    list.forEach(it=>{if(!it.doca||["Cancelado","No-show"].includes(it.status))return;const k=it.data+"|"+it.hora+"|"+it.doca;if(seen[k]){bad.add(seen[k]);bad.add(it.id)}else seen[k]=it.id});
    return bad;
  }

  function render(){
    renderAlerts();
    const list=filtered(), clash=clashes(list);
    const end=addDays(weekStart,5);
    $("#weekLabel").innerHTML=`${weekStart.getDate()} ${MESES[weekStart.getMonth()]} – ${end.getDate()} ${MESES[end.getMonth()]} ${end.getFullYear()}<small>Semana ${isoWeek(weekStart)}</small>`;

    const active=list.filter(i=>!["Cancelado","No-show"].includes(i.status));
    const pal=active.reduce((s,i)=>s+palletsOf(i),0);
    const un=active.filter(i=>i.un==="UN").reduce((s,i)=>s+(Number(i.qtd)||0),0);
    const cx=active.filter(i=>i.un==="CX").reduce((s,i)=>s+(Number(i.qtd)||0),0);
    const done=list.filter(i=>i.status==="Concluído").length;
    const empresas=new Set(active.map(i=>i.empresa.trim().toLowerCase())).size;
    $("#totals").innerHTML=[
      ["Agendamentos",active.length,`${done} concluído${done===1?"":"s"}`],
      ["Pallets",fmtN(pal),"PLT"],
      ["Unidades",fmtN(un),"UN"],

    ].map(([k,v,s])=>`<div class="tot"><span class="k">${k}</span><span class="v">${v}${s?`<small>${s}</small>`:""}</span></div>`).join("");

    const hasEx=items.some(i=>i.exemplo);

    else if(hasEx){n.hidden=false;n.innerHTML=`<span><b>Dados de exemplo.</b> Os cartões marcados como exemplo mostram como o quadro fica preenchido.</span>${canWrite?'<button class="btn" type="button" id="clearEx">Apagar exemplos</button>':""}`}
    else n.hidden=true;

  function weekText(){const e=addDays(weekStart,5);return `${pad(weekStart.getDate())}/${pad(weekStart.getMonth()+1)} a ${pad(e.getDate())}/${pad(e.getMonth()+1)}/${e.getFullYear()}`}
  const ATIVO=x=>!["Cancelado","No-show"].includes(x.status);
  function sumBy(arr,f){return arr.reduce((s,x)=>s+(Number(f(x))||0),0)}
  function reportData(list){
    const act=list.filter(ATIVO);
    const dias=DIAS.map((nm,i)=>{const d=addDays(weekStart,i),di=iso(d),its=list.filter(x=>x.data===di),a=its.filter(ATIVO);
      return {nome:nm,data:`${pad(d.getDate())}/${pad(d.getMonth()+1)}`,cargas:a.length,pallets:sumBy(a,palletsOf),un:sumBy(a.filter(x=>x.un==="UN"),x=>x.qtd),cx:sumBy(a.filter(x=>x.un==="CX"),x=>x.qtd),concl:its.filter(x=>x.status==="Concluído").length,pend:its.filter(x=>["Agendado","Chegou","Descarregando"].includes(x.status)).length}});
    const emp={};act.forEach(x=>{const k=x.empresa.trim();emp[k]=emp[k]||{empresa:k,cargas:0,pallets:0,un:0,cx:0,kg:0};const e=emp[k];e.cargas++;e.pallets+=palletsOf(x);if(x.un==="CX")e.cx+=Number(x.qtd)||0;else if(x.un==="KG")e.kg+=Number(x.qtd)||0;else e.un+=Number(x.qtd)||0});
    const empresas=Object.values(emp).sort((a,b)=>b.pallets-a.pallets||b.cargas-a.cargas);
    const sts=["Agendado","Chegou","Descarregando","Concluído","No-show","Cancelado"].map(st=>({st,n:list.filter(x=>x.status===st).length}));
    const pt={};act.forEach(x=>{if(!palletsOf(x))return;const k=x.palTipo||"Não informado";pt[k]=(pt[k]||0)+palletsOf(x)});
    return {act,dias,empresas,sts,pt};
  }
  function renderReport(list,clash){
    const R=reportData(list),maxP=Math.max(1,...R.dias.map(d=>d.pallets));
    const tot=R.dias.reduce((a,d)=>({cargas:a.cargas+d.cargas,pallets:a.pallets+d.pallets,un:a.un+d.un,cx:a.cx+d.cx,concl:a.concl+d.concl,pend:a.pend+d.pend}),{cargas:0,pallets:0,un:0,cx:0,concl:0,pend:0});
    const occ=[];

    list.filter(x=>x.status==="Cancelado").forEach(x=>occ.push(["Cancelado",`${fmtD(x.data)} ${x.hora} · ${x.empresa} · ${x.produto}`]));
    list.filter(x=>clash.has(x.id)).forEach(x=>occ.push(["Conflito",`${fmtD(x.data)} ${x.hora} · Doca ${x.doca} · ${x.empresa}`]));
    list.filter(x=>ATIVO(x)&&!x.doca).forEach(x=>occ.push(["Sem doca",`${fmtD(x.data)} ${x.hora} · ${x.empresa}`]));
    list.filter(x=>x.obs).forEach(x=>occ.push(["Obs.",`${fmtD(x.data)} ${x.hora} · ${x.empresa}: ${x.obs}`]));
    const stCls={"Conflito":"No-show","Sem doca":"Chegou","Obs.":"Agendado"};
    $("#reportView").innerHTML=`
      <div class="rbar"><div><h2>Relatório de recebimento</h2><div class="sub">Semana ${isoWeek(weekStart)} · ${weekText()}${q?` · filtro: “${esc(q)}”`:""}</div></div>
        <div class="acts"><button class="btn" type="button" id="copyTxt">Copiar resumo</button>${canXlsx?'<button class="btn primary" type="button" id="dlXlsx">Baixar Excel</button>':""}</div></div>
      <div class="rgrid">
        <div class="rcard full"><h3>Por dia</h3><div class="tw"><table><thead><tr><th>Dia</th><th style="text-align:right">Cargas</th><th style="text-align:right">Pallets</th><th></th><th style="text-align:right">UN</th><th style="text-align:right">CX</th><th style="text-align:right">Concluídas</th><th style="text-align:right">Pendentes</th></tr></thead>
          <tbody>${R.dias.map(d=>`<tr><td><b>${d.nome}</b> <span class="meta">${d.data}</span></td><td class="num">${d.cargas}</td><td class="num">${fmtN(d.pallets)}</td><td style="width:22%"><div class="bar"><i style="width:${Math.round(d.pallets/maxP*100)}%"></i></div></td><td class="num">${fmtN(d.un)}</td><td class="num">${fmtN(d.cx)}</td><td class="num">${d.concl}</td><td class="num">${d.pend}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td class="num">${tot.cargas}</td><td class="num">${fmtN(tot.pallets)}</td><td></td><td class="num">${fmtN(tot.un)}</td><td class="num">${fmtN(tot.cx)}</td><td class="num">${tot.concl}</td><td class="num">${tot.pend}</td></tr></tfoot></table></div></div>
        <div class="rcard"><h3>Por empresa</h3><div class="tw"><table><thead><tr><th>Empresa</th><th style="text-align:right">Cargas</th><th style="text-align:right">Pallets</th><th style="text-align:right">UN</th><th style="text-align:right">CX</th></tr></thead>
          <tbody>${R.empresas.length?R.empresas.map(e=>`<tr><td>${esc(e.empresa)}</td><td class="num">${e.cargas}</td><td class="num">${fmtN(e.pallets)}</td><td class="num">${fmtN(e.un)}</td><td class="num">${fmtN(e.cx)}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Sem cargas na semana.</td></tr>`}</tbody></table></div></div>
        <div class="rcard"><h3>Status e pallets</h3><div class="tw"><table><tbody>
          ${R.sts.map(x=>`<tr><td><span class="pill st-${x.st}" style="margin-left:0">${x.st}</span></td><td class="num">${x.n}</td></tr>`).join("")}
          ${Object.entries(R.pt).map(([k,v])=>`<tr><td>Pallets ${esc(k)}</td><td class="num">${fmtN(v)}</td></tr>`).join("")}
          </tbody></table></div></div>
        <div class="rcard full"><h3>Ocorrências e observações</h3><ul class="occ">${occ.length?occ.map(([t,m])=>`<li><span class="pill st-${stCls[t]||t}">${t}</span><span>${esc(m)}</span></li>`).join(""):'<li class="none">Nenhuma ocorrência na semana.</li>'}</ul></div>
      </div>`;
  }
  function fmtD(di){const [y,m,d]=di.split("-");return d+"/"+m}
  function summaryText(){
    const list=filtered(),R=reportData(list);
    const t=R.dias.reduce((a,d)=>({c:a.c+d.cargas,p:a.p+d.pallets,u:a.u+d.un,x:a.x+d.cx}),{c:0,p:0,u:0,x:0});
    let s=`*GRUPO MOAS · Agenda de Descarga*\nSemana ${isoWeek(weekStart)} (${weekText()})\n\nTotal: ${t.c} cargas · ${fmtN(t.p)} pallets · ${fmtN(t.u)} UN · ${fmtN(t.x)} CX\n`;
    DIAS.forEach((nm,i)=>{const di=iso(addDays(weekStart,i)),its=list.filter(x=>x.data===di);if(!its.length)return;
      s+=`\n*${nm} ${fmtD(di)}*\n`;its.forEach(x=>{s+=`${x.hora}${x.doca?" "+x.doca:""} · ${x.empresa} · ${x.produto}${x.qtd?" · "+fmtN(x.qtd)+" "+(x.un||"UN"):""}${palletsOf(x)?" · "+palletsOf(x)+" PLT":""} [${x.status}]\n`})});
    return s;
  }
  async function copySummary(btn){
    const txt=summaryText();
    try{await navigator.clipboard.writeText(txt);toast("Resumo copiado")}
    catch(e){const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;left:16px;right:16px;bottom:16px;height:40vh;z-index:40";document.body.appendChild(ta);ta.select();toast("Selecione e copie o texto");ta.addEventListener("blur",()=>ta.remove())}
  }
  async function downloadXlsx(){
    if(!window.XLSX){toast("Exportação indisponível: recarregue a página");return}
    const list=filtered(),R=reportData(list),X=window.XLSX,wb=X.utils.book_new();

    a1["!cols"]=[{wch:8},{wch:8},{wch:8},{wch:9},{wch:9},{wch:9},{wch:11},{wch:10}];

    a2["!cols"]=[8,6,6,6,26,20,28,11,8,8,14,13,10,12,13,34].map(w=>({wch:w}));
    X.utils.book_append_sheet(wb,a2,"Agendamentos");
    const a3=X.utils.aoa_to_sheet([["Empresa","Cargas","Pallets","UN","CX","KG"]].concat(R.empresas.map(e=>[e.empresa,e.cargas,e.pallets,e.un,e.cx,e.kg])));
    a3["!cols"]=[{wch:30},{wch:8},{wch:9},{wch:9},{wch:9},{wch:9}];

    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    const name=`Agenda_Descarga_S${isoWeek(weekStart)}_${iso(weekStart)}.xlsx`;
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));

  }

  let alertH=2;
  try{const h=Number(localStorage.getItem("agenda-alerta-h"));if([1,2,3,4,6].includes(h))alertH=h}catch(e){}
  function fmtMin(m){m=Math.round(Math.abs(m));const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?pad(r):""}`:`${r} min`}
  // Só cargas ainda "Agendado" contam: se já chegou, não há o que avisar
  function urgency(x){
    if(x.status!=="Agendado"||!x.data||!x.hora)return null;
    const [y,mo,d]=x.data.split("-").map(Number),[hh,mm]=x.hora.split(":").map(Number);
    const diff=(new Date(y,mo-1,d,hh,mm)-new Date())/60000;
    if(diff<-15)return {k:"late",min:diff,txt:"Atrasado "+fmtMin(diff)};
    if(diff<=alertH*60)return {k:"soon",min:diff,txt:diff<=0?"Chegando agora":"Chega em "+fmtMin(diff)};
    return null;
  }
  function renderAlerts(){
    const today=iso(new Date());
    const urg=items.filter(x=>x.data>=iso(addDays(new Date(),-1))&&x.data<=today||x.data===iso(addDays(new Date(),1))).map(x=>({x,u:urgency(x)})).filter(o=>o.u).sort((a,b)=>a.u.min-b.u.min);
    const late=urg.filter(o=>o.u.k==="late"),soon=urg.filter(o=>o.u.k==="soon");
    const bar=$("#alertBar");
    bar.className="alertbar"+(late.length?" late":soon.length?" soon":"");
    const opts=[1,2,3,4,6].map(h=>`<option value="${h}"${h===alertH?" selected":""}>${h}h antes</option>`).join("");
    let msg;
    if(!urg.length) msg=`Nenhuma descarga nas próximas ${alertH}h<small>Cargas agendadas passam a piscar aqui e no quadro quando faltar ${alertH}h ou menos.</small>`;
    else{
      const parts=[];if(late.length)parts.push(`${late.length} atrasada${late.length>1?"s":""}`);if(soon.length)parts.push(`${soon.length} nas próximas ${alertH}h`);
      msg=parts.join(" · ")+`<small>${urg.slice(0,4).map(o=>`${o.x.hora}${o.x.doca?" "+esc(o.x.doca):""} ${esc(o.x.empresa)} — ${o.u.txt}`).join(" · ")}${urg.length>4?` · +${urg.length-4}`:""}</small>`;
    }
    bar.innerHTML=`<span class="dot" aria-hidden="true"></span><span class="msg">${msg}</span><label for="alertSel">Avisar</label><select id="alertSel">${opts}</select>${urg.length&&iso(weekStart)!==iso(mondayOf(new Date()))?'<button class="btn" type="button" id="goToday">Ver hoje</button>':""}`;
    const n=late.length+soon.length;
    document.title=(n?`(${n}) `:"")+"Agenda de Recebimento MOAS";
  }

  function card(x,isClash){
    const qty=[];
    if(x.qtd) qty.push(`<span><b>${fmtN(x.qtd)}</b> ${esc(x.un||"UN")}</span>`);
    if(palletsOf(x)) qty.push(`<span><b>${fmtN(palletsOf(x))}</b> PLT${x.palTipo?" · "+esc(x.palTipo):""}</span>`);
    else if(x.palTipo) qty.push(`<span>${esc(x.palTipo)}</span>`);
    const meta=[x.veiculo,x.placa,x.nf].filter(Boolean).map(esc).join(" · ");
    const done=["Concluído","Cancelado","No-show"].includes(x.status);
    const u=urgency(x);
    return `<button type="button" class="card${done?" done":""}${u?" urg-"+u.k:""}" data-id="${esc(x.id)}">
      ${u?`<span class="eta ${u.k}">⏱ ${u.txt}</span>`:""}
      <span class="top"><span class="time">${esc(x.hora)}</span>${x.doca?`<span class="dock">${esc(x.doca)}</span>`:""}${x.exemplo?'<span class="tag">exemplo</span>':""}<span class="pill st-${esc(x.status)}">${esc(x.status)}</span></span>
      <span class="company">${esc(x.empresa)}</span>
      <span class="product">${esc(x.produto)}</span>
      ${qty.length?`<span class="qty">${qty.join("")}</span>`:""}
      ${meta?`<span class="meta">${meta}</span>`:""}
      ${x.obs?`<span class="meta">⚑ ${esc(x.obs)}</span>`:""}
      ${isClash?`<span class="clash">Conflito: mesma doca e horário</span>`:""}
    </button>`;
  }

  // Formulário
  const F={data:"#fData",hora:"#fHora",doca:"#fDoca",status:"#fStatus",empresa:"#fEmpresa",transportadora:"#fTransp",placa:"#fPlaca",veiculo:"#fVeiculo",nf:"#fNF",produto:"#fProduto",qtd:"#fQtd",un:"#fUn",pallets:"#fPallets",palTipo:"#fPalTipo",obs:"#fObs"};
  function openForm(it,day){
    editingId=it?it.id:null;
    $("#dTitle").textContent=it?"Editar agendamento":"Novo agendamento";
    let defDay=day;
    if(!defDay){const t=iso(new Date());defDay=(t>=iso(weekStart)&&t<iso(addDays(weekStart,6)))?t:iso(weekStart)}
    const base=it||{data:defDay,hora:"08:00",status:"Agendado",un:"UN"};
    Object.entries(F).forEach(([k,s])=>{$(s).value=base[k]??""});
    if(!$("#fUn").value)$("#fUn").value="UN";
    $("#formMsg").textContent="";
    $("#delZone").innerHTML=it&&canWrite?'<button class="btn danger" type="button" id="dDel">Excluir</button>':"";
    const ro=!canWrite;
    document.querySelectorAll("#form input,#form select,#form textarea").forEach(e=>e.disabled=ro);
    $("#dSave").hidden=ro;
    $("#scrim").hidden=false;$("#drawer").hidden=false;
    setTimeout(()=>(it?$("#fStatus"):$("#fEmpresa")).focus(),30);
  }
  function closeForm(){$("#scrim").hidden=true;$("#drawer").hidden=true;editingId=null}

  async function save(e){
    e.preventDefault();
    const v={};Object.entries(F).forEach(([k,s])=>v[k]=$(s).value.trim());
    const miss=[["data","Data"],["hora","Horário"],["empresa","Empresa"],["produto","Produto"]].filter(([k])=>!v[k]).map(([,l])=>l);
    if(miss.length){$("#formMsg").textContent="Preencha: "+miss.join(", ");return}
    v.qtd=v.qtd===""?0:Number(v.qtd);v.pallets=v.pallets===""?0:Number(v.pallets);
    v.placa=v.placa.toUpperCase();
    const prev=editingId?items.find(i=>i.id===editingId):null;
    v.exemplo=prev?!!prev.exemplo:false;
    if(offline){toast("Modo demonstração: nada foi salvo");closeForm();return}
    $("#dSave").disabled=true;
    try{
      const row=toRow(v);
      const r=editingId?await sb.from(TABLE).update(row).eq("id",editingId):await sb.from(TABLE).insert(row);
      if(r.error)throw r.error;
      await load();
      toast(editingId?"Agendamento atualizado":"Agendamento salvo");
      closeForm();
    }catch(err){
      const m=String(err&&err.message||"");
      $("#formMsg").textContent=/fetch|network/i.test(m)?"Sem conexão agora. Tente salvar de novo em alguns segundos.":"Não foi possível salvar: "+(m||"erro desconhecido");
    }finally{$("#dSave").disabled=false}
  }

  async function del(){
    if(offline||!editingId)return;
    const r=await sb.from(TABLE).delete().eq("id",editingId);
    if(r.error){$("#formMsg").textContent="Não foi possível excluir: "+r.error.message;return}
    toast("Agendamento excluído");closeForm();load()
  }

  async function clearExamples(){
    const r=await sb.from(TABLE).delete().eq("exemplo",true);
    if(r.error){toast("Não foi possível apagar os exemplos");return}
    toast("Exemplos apagados");load()
  }

  // Eventos
  document.addEventListener("click",e=>{
    const c=e.target.closest("[data-id]");
    if(c&&!e.target.closest("#drawer")){const it=items.find(i=>i.id===c.dataset.id);if(it)openForm(it);return}
    const a=e.target.closest("[data-add]");if(a){openForm(null,a.dataset.add);return}
    if(e.target.id==="goToday"){weekStart=mondayOf(new Date());render();return}
    if(e.target.id==="copyTxt"){copySummary(e.target);return}
    if(e.target.id==="dlXlsx"){downloadXlsx();return}
    if(e.target.id==="clearEx"){e.target.outerHTML='<span class="confirm">Apagar todos os exemplos? <button class="btn danger" type="button" id="clearExYes">Apagar</button><button class="btn" type="button" id="clearExNo">Manter</button></span>';return}
    if(e.target.id==="clearExYes"){clearExamples();return}
    if(e.target.id==="clearExNo"){render();return}
    if(e.target.id==="dDel"){$("#delZone").innerHTML='<span class="confirm">Excluir? <button class="btn danger" type="button" id="dDelYes">Sim</button><button class="btn" type="button" id="dDelNo">Não</button></span>';return}
    if(e.target.id==="dDelYes"){del();return}
    if(e.target.id==="dDelNo"){$("#delZone").innerHTML='<button class="btn danger" type="button" id="dDel">Excluir</button>';return}
  });
  $("#btnNew").onclick=()=>openForm(null,null);
  $("#dClose").onclick=closeForm;$("#dCancel").onclick=closeForm;$("#scrim").onclick=closeForm;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden)closeForm()});
  $("#form").addEventListener("submit",save);
  $("#prevW").onclick=()=>{weekStart=addDays(weekStart,-7);if(!offline&&loadedFrom&&iso(weekStart)<loadedFrom)load();render()};
  $("#nextW").onclick=()=>{weekStart=addDays(weekStart,7);render()};
  $("#thisW").onclick=()=>{weekStart=mondayOf(new Date());render()};
  $("#q").addEventListener("input",e=>{q=e.target.value;render()});
  function setView(v){view=v;["board","table","report"].forEach(k=>$({board:"#vBoard",table:"#vTable",report:"#vReport"}[k]).setAttribute("aria-pressed",k===v));try{localStorage.setItem("agenda-view",v)}catch(e){}render()}
  $("#vBoard").onclick=()=>setView("board");$("#vTable").onclick=()=>setView("table");$("#vReport").onclick=()=>setView("report");
  try{const v=localStorage.getItem("agenda-view");if(["board","table","report"].includes(v))view=v}catch(e){}
  ["board","table","report"].forEach(k=>$({board:"#vBoard",table:"#vTable",report:"#vReport"}[k]).setAttribute("aria-pressed",k===view));

  document.addEventListener("change",e=>{if(e.target.id==="alertSel"){alertH=Number(e.target.value);try{localStorage.setItem("agenda-alerta-h",alertH)}catch(_){}render()}});
  // Reavalia os prazos a cada minuto (não mexe no formulário aberto)
  setInterval(()=>{if(!document.hidden)render()},60000);

  // Primeiro quadro: vazio até o armazenamento responder
  render();

  function fromRow(r){return {id:r.id,data:r.data,hora:String(r.hora||"").slice(0,5),doca:r.doca||"",status:r.status,empresa:r.empresa||"",transportadora:r.transportadora||"",placa:r.placa||"",veiculo:r.veiculo||"",nf:r.nf||"",produto:r.produto||"",qtd:Number(r.qtd)||0,un:r.un||"UN",pallets:Number(r.pallets)||0,palTipo:r.pal_tipo||"",obs:r.obs||"",exemplo:!!r.exemplo}}
  function toRow(v){const n=x=>x===""?null:x;return {data:v.data,hora:v.hora,doca:n(v.doca),status:v.status||"Agendado",empresa:v.empresa,transportadora:n(v.transportadora),placa:n(v.placa),veiculo:n(v.veiculo),nf:n(v.nf),produto:v.produto,qtd:v.qtd,un:v.un||"UN",pallets:v.pallets,pal_tipo:n(v.palTipo),obs:n(v.obs),exemplo:!!v.exemplo}}
  let loading=null;
  async function load(){
    if(!sb)return;
    const floor=iso(addDays(mondayOf(new Date()),-7*26));
    const from=loadedFrom&&loadedFrom<floor?loadedFrom:floor;
    const want=iso(weekStart)<from?iso(weekStart):from;
    const {data,error}=await sb.from(TABLE).select("*").gte("data",want).order("data").order("hora").limit(5000);
    if(error){$("#syncState").textContent="Sem conexão";if(!items.length){offline=true;items=sampleWeek();render()}return}
    offline=false;loadedFrom=want;items=data.map(fromRow);
    $("#syncState").textContent="Ao vivo · atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    render();
  }
  let reloadT=null;function scheduleLoad(){clearTimeout(reloadT);reloadT=setTimeout(load,300)}
  (async()=>{
    if(!window.supabase){offline=true;items=sampleWeek();$("#syncState").textContent="Sem conexão";render();return}
    sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    await load();
    sb.channel("agenda_descarga").on("postgres_changes",{event:"*",schema:"public",table:TABLE},scheduleLoad).subscribe();
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)scheduleLoad()});
    setInterval(()=>{if(!document.hidden)load()},120000);
  })();
})();
</script>
</body>
</html>
